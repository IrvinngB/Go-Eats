services:
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: goeats-postgres
    environment:
      POSTGRES_USER: goeats
      POSTGRES_PASSWORD: goeats_password
      POSTGRES_DB: goeats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goeats -d goeats"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goeats-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goeats-api
    environment:
      DATABASE_URL: postgresql+psycopg://goeats:goeats_password@postgres:5432/goeats
      JWT_SECRET_KEY: change-me-in-production-goeats-secret
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin_password
      S3_BUCKET_NAME: goeats-storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goeats-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
